services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rent_backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - DATABASE_URL=file:/app/data/prod.db
      - JWT_SECRET=production-super-secret-jwt-key-rent-cars-houses-2026
    ports:
      - "5000:5000"
    volumes:
      - rent_db_data:/app/data
      - rent_uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: rent_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  rent_db_data:
  rent_uploads_data:
